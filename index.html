<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniFood Food Delivery | Say NO to junk food, Say YES to healthy food...!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body>
    <header id="navbar">
        <div class="navbar-logo">
            <img src="assets/logo.png" alt="OmniFood Logo" >
        </div>
        <div class="sections">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#testimonials">Testimonials</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </div>
    </header>
    <main class="page-sections">
        <section id="home" class="content-section">
            <h2>Home</h2>
            <p id="tagline">
                <span class="tagline-line tagline-line--first">Say NO to junk food,</span>
                <span class="tagline-line tagline-line--second">Say YES to healthy food...!</span>
            </p>
        </section>
        <section id="menu" class="content-section">
            <h2>Menu</h2>
            <p>Explore the menu here.</p>
        </section>
        <section id="testimonials" class="content-section">
            <h2>Testimonials</h2>
            <p>Read customer reviews here.</p>
        </section>
        <section id="about" class="content-section">
            <h2>About</h2>
            <p>Learn more about OmniFood here.</p>
        </section>
    </main>
</body>
</html>
